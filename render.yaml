# render.yaml
# Render configuration for NetraVaultOG (single Node.js service)
services:
  - type: web
    name: netravault-og
    env: node
    region: singapore
    plan: free
    buildCommand: "npm run render-build"
    startCommand: "npm start"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
    healthCheckPath: "/api/health"
