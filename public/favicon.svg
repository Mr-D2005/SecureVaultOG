<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="eyeGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#7c3aed" stop-opacity="1" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.9" />
    </linearGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="1" />
      <stop offset="40%" stop-color="#7c3aed" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#06030f" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Cyber Shield/Hexagon -->
  <polygon points="50,6 88,24 88,68 50,94 12,68 12,24" 
           fill="#0a0515" stroke="url(#shieldGrad)" stroke-width="3.5" stroke-linejoin="round" />
  
  <!-- Vault Corner Notches -->
  <path d="M 50 12 L 82 27 L 82 65 L 50 88 L 18 65 L 18 27 Z" 
        fill="none" stroke="rgba(192, 132, 252, 0.3)" stroke-width="1.5" stroke-dasharray="4 2" />

  <!-- Sentinel Eye Outline (Vault Eye) -->
  <path d="M 22,50 Q 50,22 78,50 Q 50,78 22,50 Z" 
        fill="rgba(124, 58, 237, 0.15)" stroke="url(#eyeGrad)" stroke-width="3" filter="url(#glow)" stroke-linecap="round" />

  <!-- Outer Iris Ring -->
  <circle cx="50" cy="50" r="16" fill="none" stroke="#c084fc" stroke-width="2" stroke-dasharray="6 3" />
  
  <!-- Inner Iris Core / Vault Keyhole -->
  <circle cx="50" cy="50" r="10" fill="url(#coreGlow)" />
  <circle cx="50" cy="50" r="6" fill="#0f0820" stroke="#a855f7" stroke-width="2" />
  
  <!-- Center Pupil / Encrypted Key Spark -->
  <circle cx="50" cy="50" r="2.5" fill="#c084fc" />
  
  <!-- Digital Reticle Target Crosshairs -->
  <line x1="50" y1="28" x2="50" y2="36" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" />
  <line x1="50" y1="64" x2="50" y2="72" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" />
  <line x1="28" y1="50" x2="36" y2="50" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" />
  <line x1="64" y1="50" x2="72" y2="50" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" />
</svg>
